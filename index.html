<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衍生性刷題">
<link rel="apple-touch-icon" href="icon.png">
<title>衍生性金融商品｜同考點刷題</title>
<style>
:root{
  --bg:#EAF5F4;--card:#FFFFFF;--ink:#17403F;--soft:#4E6F6E;--line:#C9E3E1;
  --teal:#379392;--blue:#4F86C6;--sky:#4FB0C6;--violet:#6C49B8;
  --ok:#67D5B5;--okbg:#DDF6EE;--bad:#EE7785;--badbg:#FCE4E7;--chip:#E3EDFA;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#102A2E;--card:#17373C;--ink:#E4F4F2;--soft:#A7C6C4;--line:#2A5157;
  --okbg:#1E4A40;--badbg:#4A2530;--chip:#23405E;}}
:root[data-theme="dark"]{--bg:#102A2E;--card:#17373C;--ink:#E4F4F2;--soft:#A7C6C4;--line:#2A5157;--okbg:#1E4A40;--badbg:#4A2530;--chip:#23405E;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1{font-size:26px;line-height:1.3;margin:6px 0 4px;color:var(--teal)}
.sub{color:var(--soft);font-size:15px;margin:0 0 18px}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;color:var(--blue)}
.stat span{font-size:13px;color:var(--soft)}
.wrongbtn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--badbg);color:var(--ink);font-weight:700;margin-bottom:18px;text-align:left;border-left:6px solid var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--soft);margin:0 0 14px}
.toggle input{width:20px;height:20px;accent-color:var(--teal)}
.ch{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:6px solid var(--teal)}
.ch .t{font-weight:700;font-size:18px}
.ch .m{font-size:14px;color:var(--soft)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 8px;z-index:5;display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px}
.top .ttl{font-weight:700;color:var(--teal);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.grp .s{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grp .m{font-size:13px;color:var(--soft);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.freq{background:var(--violet);color:#fff;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
.freq.one{background:var(--line);color:var(--soft)}
.done{color:var(--teal);font-weight:700}
.start{width:100%;border:0;border-radius:14px;padding:14px;background:var(--teal);color:#fff;font-weight:700;font-size:17px;margin:4px 0 14px}
.kp{font-size:14px;color:var(--soft);margin:4px 0 10px}
.kp b{color:var(--violet)}
.qcard{background:var(--card);border-radius:16px;padding:18px 16px}
.src{display:inline-block;font-size:13px;background:var(--chip);color:var(--blue);border-radius:8px;padding:2px 8px;margin-bottom:8px;font-weight:500}
.stem{font-size:18px;font-weight:500;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:12px;padding:12px;margin-bottom:10px;font-size:16px;line-height:1.5}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .n{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin-top:4px;font-size:15px}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--badbg)}
.fb p{margin:4px 0}
.law{font-size:14px;color:var(--soft);margin-top:10px;border-left:4px solid var(--sky);padding-left:10px}
.exp{margin-top:10px;border-left:4px solid var(--violet);padding:8px 12px;background:var(--chip);border-radius:0 12px 12px 0;font-size:15px}
.exp p{margin:6px 0}.exp .pg{font-size:13px;color:var(--soft);margin-top:8px}.exp .muted{color:var(--soft)}
.exp summary{cursor:pointer;font-weight:700;color:var(--violet)}.exp .eh{font-weight:700;color:var(--violet)}
.exambtn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--chip);color:var(--ink);font-weight:700;margin-bottom:10px;text-align:left;border-left:6px solid var(--violet)}
.pgrid,.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qgrid{grid-template-columns:repeat(6,1fr);gap:6px}
.pbtn,.qn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.qn{padding:7px 0;font-size:14px}
.pbtn small{font-size:11px;color:var(--teal)}
.pbtn.did{border-color:var(--teal)}
.qn.a{background:var(--chip);border-color:var(--blue)}
.qn.cur{outline:3px solid var(--violet)}
.opt.sel{border-color:var(--blue);background:var(--chip)}
.opt.sel .n{background:var(--blue);color:#fff}
.timer{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.timer.late{color:var(--bad)}
.score{border-radius:16px;padding:20px;text-align:center;margin:6px 0 12px}
.score b{display:block;font-size:48px;line-height:1.1}
.score.pass{background:var(--okbg)}.score.pass b{color:var(--teal)}
.score.fail{background:var(--badbg)}.score.fail b{color:var(--bad)}
.fbl{margin:4px 0;font-size:15px;padding:6px 10px;border-radius:8px}
.fbl.no{background:var(--badbg)}.fbl.ok{background:var(--okbg)}
.xfer{margin-top:22px;background:var(--card);border-radius:14px;padding:12px 14px}.xfer .back{margin:4px 4px 0 0}
.curbox{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border-left:6px solid var(--blue)}.curbox .start{margin:10px 0 8px}
.del{border:0;background:var(--badbg);color:var(--ink);border-radius:8px;padding:2px 10px;font-size:13px;margin-left:6px}
.ver{font-size:13px;color:var(--soft);margin:18px 0 0}
.jy{margin-top:8px;font-size:15px;border-left:4px solid var(--violet);padding-left:10px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;gap:10px;max-width:640px;margin:0 auto}
.nav button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.nav .p{background:var(--card)} .nav .n2{background:var(--blue);color:#fff}
.empty{background:var(--card);border-radius:14px;padding:20px;text-align:center;color:var(--soft)}
.reset{border:0;background:none;color:var(--soft);font-size:14px;text-decoration:underline;margin-top:20px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D={"chapters":[{"id":"intro","name":"衍生性商品基本觀念"},{"id":"fwd","name":"遠期與外匯"},{"id":"fut","name":"期貨"},{"id":"opt","name":"選擇權"},{"id":"swap","name":"交換"},{"id":"struct","name":"結構型商品"},{"id":"risk","name":"風險管理"},{"id":"acct","name":"會計處理"},{"id":"law","name":"法規與自律規範"}],"groups":[{"c":"intro","q":[745,442,3],"jy":"5","lo":0,"ex":"金融交換最早是從「平行貸款」和「相互擔保貸款」演變而來：兩家不同國家的公司互相借錢給對方在本國的子公司，後來才發展成正式的交換契約。"},{"c":"intro","q":[741,561,1],"jy":"5","lo":0,"ex":"衍生性商品的標的是匯率、利率、股價、指數、商品等「價格或指標」。可轉換公司債本身是一種有價證券，不是這裡說的標的資產。"},{"c":"intro","q":[1043,52],"jy":"46","lo":0,"ex":"進口商 3 個月後要付歐元，要用新臺幣去買歐元。新臺幣貶值時，要花更多新臺幣才買得到同樣的歐元，所以進口商怕新臺幣貶值。"},{"c":"intro","q":[560,138],"jy":"5","lo":0,"ex":"我國衍生性商品在集中市場(期交所的期貨、選擇權)和店頭市場(銀行間議價)都有交易。"},{"c":"intro","q":[518,224],"jy":"19","lo":0,"ex":"看升人民幣＝看跌美元兌人民幣。要買「USD Put / CNY Call」，也就是買進賣美元、買人民幣的權利。"},{"c":"intro","q":[405,345],"jy":"33","lo":1,"ex":"違約機率(假設違約時拿不回錢)≈ 1－公司債價格 ÷ 同天期公債價格。公司債比公債便宜的部分，就是市場對違約的預期。注意：其中一期官方公告本題無正確答案。"},{"c":"intro","q":[1111,220],"jy":"5","lo":0,"ex":"衍生性商品的四種基本契約是遠期、期貨、選擇權、交換。股票是現貨，不是衍生性契約。"},{"c":"intro","q":[922,682],"jy":"5","lo":0,"ex":"交換契約的演進順序：平行貸款 → 相互擔保貸款 → 換匯換利 → 利率交換。最早的是平行貸款。"},{"c":"intro","q":[622,2],"jy":"5","lo":0,"ex":"衍生性商品的功能有風險管理(避險)、投機、促進市場完整性，也提供「套利」機會。「管制套利」不是它的功能。"},{"c":"intro","q":[807,143],"jy":"5","lo":0,"ex":"主管機關把公債和外幣的保證金交易，歸類為第五種衍生性商品。"},{"c":"intro","q":[87],"jy":"55","lo":1,"ex":"國際上衍生性商品交易最常用的是 ISDA(國際交換暨衍生性商品協會)的標準契約。"},{"c":"intro","q":[158],"jy":"21","lo":0,"ex":"台灣的權證有歐式也有美式，「均為歐式」是錯的。"},{"c":"intro","q":[170],"jy":"23","lo":1,"ex":"利差交易是一買一賣，賺兩種利率間差距的變化，例如 NOB、TED spread。預期利率「全面」上揚時，所有債券都跌，應該直接放空，不是做利差交易。"},{"c":"intro","q":[511],"jy":"5","lo":1,"ex":"衍生性商品比現貨交易成本低、流動性高、容易放空。「放空不易」剛好相反，所以不是優勢。"},{"c":"intro","q":[636],"jy":"28","lo":0,"ex":"CDOs 依發行動機分成套利型(賺資產和負債的利差)和資產負債表型(銀行把資產移出表外)。"},{"c":"fwd","q":[1163,804,564,269],"jy":"23","lo":0,"ex":"遠期利率協定(FRA)和一般合約一樣有買方也有賣方。買方是怕利率上升的一方，賣方是怕利率下跌的一方。"},{"c":"fwd","q":[635,340,169],"jy":"23","lo":1,"ex":"FRA 買方怕利率上升。市場利率 8% 高於約定 7%，買方收錢。金額＝本金 × 利差 × 期間，再用市場利率折現回結算日，所以略少於 5,000，選 4,859。"},{"c":"fwd","q":[1055,407,234],"jy":"24","lo":0,"ex":"換匯點「前小後大」(15-22)代表升水，用加的：買價 1.1856＋0.0015＝1.1871，賣價 1.1866＋0.0022＝1.1888。"},{"c":"fwd","q":[1078,898,293],"jy":"23","lo":0,"ex":"1×4 代表 1 個月後開始、為期 3 個月。交割金額＝100 萬 × (8%－7%) × 90/360＝2,500，再折現：2,500 ÷ (1＋8% × 90/360)＝2,451 元。"},{"c":"fwd","q":[874,696,341],"jy":"24","lo":0,"ex":"換匯點「前小後大」(15-22)代表升水，用加的：0.9756＋0.0015＝0.9771，0.9766＋0.0022＝0.9788。"},{"c":"fwd","q":[1167,512,53],"jy":"24","lo":0,"ex":"銀行同業之間用換匯點報價；銀行對一般出口廠商，直接報出遠期匯率。"},{"c":"fwd","q":[519,51],"jy":"23","lo":0,"ex":"利差清算金額＝1,000 萬 × (7.5%－6.5%) × 90/360＝25,000，再折現：25,000 ÷ (1＋7.5% × 90/360)≈ 24,540。"},{"c":"fwd","q":[992,147],"jy":"23","lo":0,"ex":"遠期交割是指交割日晚於「即期交割日」(一般是成交後第二個營業日)的交易。"},{"c":"fwd","q":[568,171],"jy":"24","lo":0,"ex":"換匯點「前大後小」(45-35)代表貼水，用減的。乙願意做 35，代表甲是 B/S：即期用 120.38 買入，遠期用 120.38－0.35＝120.03 賣出。"},{"c":"fwd","q":[1198,637],"jy":"24","lo":0,"ex":"遠期匯率＝即期 ×(1＋新臺幣利率 × 期間)÷(1＋美元利率 × 期間)＝33 × 1.0025 ÷ 1.003≈ 32.9835。美元利率較高，所以美元遠期會貼水變便宜。"},{"c":"fwd","q":[565,4],"jy":"23","lo":0,"ex":"遠期交換是約定未來才生效的交換，本質是遠期契約；期貨選擇權是以期貨為標的的選擇權，本質是選擇權。"},{"c":"fwd","q":[750,446],"jy":"23","lo":0,"ex":"約定未來某一天、用特定價格買賣特定數量的商品，就是遠期契約的定義。"},{"c":"fwd","q":[563,10],"jy":"23","lo":0,"ex":"換匯點為正代表遠期比即期貴，叫升水；為負代表遠期比即期便宜，叫貼水。說負值是升水是錯的。"},{"c":"fwd","q":[1104,697],"jy":"23","lo":0,"ex":"FRA 只交割利差、不交換本金，所以信用風險比遠期性存款「低」。說遠期性存款信用風險較低是錯的。"},{"c":"fwd","q":[226],"jy":"9","lo":0,"ex":"遠期(長天期)利率上升得比即期(短天期)多，長短利差拉大，殖利率曲線變陡峭。"},{"c":"fwd","q":[439],"jy":"5","lo":1,"ex":"衍生性商品和賭博的共通點是表外交易、高槓桿、零和遊戲。但衍生性商品的價格有經濟基礎，不是完全靠運氣。"},{"c":"fwd","q":[460],"jy":"46","lo":1,"ex":"賣出 EUR Call 是收權利金、賭歐元不會漲，所以看法是歐元會下跌(或至少不漲)。"},{"c":"fwd","q":[510],"jy":"23","lo":0,"ex":"遠期匯率＝32 ×(1＋3% × 0.5)÷(1＋2% × 0.5)＝32 × 1.015 ÷ 1.01≈ 32.1584。新臺幣利率較高，美元遠期會升水。"},{"c":"fwd","q":[1051],"jy":"23","lo":0,"ex":"以利率為標的的遠期契約，就是遠期利率協定(FRA)。"},{"c":"fut","q":[1118,759,419,236,117],"jy":"15","lo":0,"ex":"長期公債期貨報價「105-24」代表 105 又 24/32。每跳 1/32 的價值是 10 萬美元 × 1% ÷ 32 = 31.25 美元。從 105-24 漲到 105-28 共 4 跳，買方獲利 4 × 31.25 = 125 美元。"},{"c":"fut","q":[1172,1110,927,817,514],"jy":"15","lo":0,"ex":"遠期契約是雙方私下簽訂的，買賣雙方都要承擔對方違約的信用風險。期貨則有結算所居中擔保，所以信用風險由結算所承擔。"},{"c":"fut","q":[1174,681,219,11],"jy":"15","lo":0,"ex":"期貨撮合時，市價申報優先於限價申報。"},{"c":"fut","q":[408,151,98],"jy":"27","lo":1,"ex":"TED spread 是歐洲美元期貨和美國國庫券期貨之間的利差，反映銀行信用風險。"},{"c":"fut","q":[270,107],"jy":"13","lo":0,"ex":"臺指期的到期月份是交易當月起連續兩個月，再加上三月、六月、九月、十二月中三個接續的季月。有一期官方公告本題無正確答案。"},{"c":"fut","q":[935,342],"jy":"15","lo":0,"ex":"每跳價值＝契約數量 × 最小跳動點。62,500 × 0.0001＝6.25 美元；跳動點 0.0002 就是 12.5 美元。"},{"c":"fut","q":[1102,620],"jy":"14","lo":0,"ex":"期貨反映市場對未來的預期，而且交易成本低、反應快，所以期貨價格通常領先現貨價格。"},{"c":"fut","q":[801,468],"jy":"15","lo":0,"ex":"期貨在交易所公開「競價」，遠期契約是雙方私下「議價」。題目把兩者講反了。"},{"c":"fut","q":[67],"jy":"60","lo":0,"ex":"退休基金、期貨商、政府投資機構都屬於專業機構投資人。總資產超過 5,000 萬元的外國法人雖然是專業客戶，但可以書面申請改成非專業投資人。"},{"c":"fut","q":[114],"jy":"32","lo":1,"ex":"轉換因子＝把這張債券用 6% 殖利率折現算出的價格 ÷ 面額。票面利率 10% 高於 6%，所以轉換因子會大於 1。"},{"c":"fut","q":[119],"jy":"13","lo":1,"ex":"外匯期貨的保證金依交易所規定，遠匯通常不一定收保證金，題目寫的 7%、5% 固定比例是錯的。"},{"c":"fut","q":[136],"jy":"47","lo":1,"ex":"非避險目的的期貨保證金，帳列「持有供交易之金融資產」。"},{"c":"fut","q":[159],"jy":"7","lo":0,"ex":"VIX 恐慌指數是用 S&P 500 選擇權價格推算出來的隱含波動率。"},{"c":"fut","q":[168],"jy":"15","lo":1,"ex":"利率上升時，長期債券跌得比中期多，所以要買中期、賣長期。利率下跌時要反過來做：買長期、賣中期。"},{"c":"fut","q":[172],"jy":"20","lo":1,"ex":"遠月貴、近月便宜，預期價差會縮小，就賣貴的(遠月)、買便宜的(近月)，一個月後反向平倉賺價差縮小的錢。"},{"c":"fut","q":[173],"jy":"18","lo":1,"ex":"避險口數＝β × 投資組合價值 ÷(期貨指數 × 每點價值)＝1.2 × 1,000,000 ÷(400 × 500)＝6 口。手上持有股票怕跌，所以要「賣」期貨。"},{"c":"fut","q":[303],"jy":"23","lo":1,"ex":"轉換因子是用 CBOT 規定的標準殖利率(6%)算出來的固定係數，每張可交割債券各有一個，跟哪一張是最便宜交割債券無關。"},{"c":"fut","q":[625],"jy":"15","lo":0,"ex":"期貨集中市場撮合：先比價格(價格優先)，同價格再比誰先下單(時間優先)。"},{"c":"fut","q":[695],"jy":"18","lo":1,"ex":"歐洲美元期貨的標的是 3 個月期歐洲美元定存利率，屬於短期利率期貨，不是外匯期貨。"},{"c":"fut","q":[861],"jy":"15","lo":0,"ex":"contract month 是契約的交割(到期)月份。"},{"c":"fut","q":[866],"jy":"14","lo":0,"ex":"期貨在交易所公開競價；遠期契約是雙方私下議價。期貨流動性較高，通常到期前反向平倉；遠期多數到期才交割。"},{"c":"fut","q":[981],"jy":"14","lo":0,"ex":"交易保證金是期貨商向客戶收的，結算保證金是結算所向結算會員收的，錢最後都會流到結算所，不是由期貨經紀商自己決定要不要交。"},{"c":"fut","q":[506],"jy":"14","lo":0,"ex":"期貨只在交易所(集中市場)交易；遠期和交換契約是在店頭市場私下議定。所以不在店頭市場交易的只有期貨。"},{"c":"fut","q":[572],"jy":"14","lo":0,"ex":"期貨價格反應快、會領先現貨，代表期貨有「價格發現」的功能。"},{"c":"fut","q":[931],"jy":"15","lo":0,"ex":"期貨和遠期的差別在交易場所、標準化程度、信用風險由誰承擔、交割方式。交易標的可以一樣(例如都做外匯)，所以不是主要差異。"},{"c":"opt","q":[1170,1137,689,513,344,347,179],"jy":"19","lo":0,"ex":"買權到期損益＝Max(股價－履約價, 0)－權利金。買方：130－120－5＝賺 5。賣方剛好相反：收 5 元權利金，付出 123－120＝3，所以賺 2。"},{"c":"opt","q":[1164,863,624,213,141,6],"jy":"20","lo":0,"ex":"利率上下限(Collar)＝買進利率上限(Cap)＋賣出利率下限(Floor)。用賣 Floor 收到的權利金，去抵買 Cap 的成本。"},{"c":"opt","q":[1166,923,808,501,214],"jy":"19","lo":0,"ex":"權利金由低到高是亞洲式＜歐式＜美式。亞洲式用平均價結算，波動較小，所以最便宜；美式可以隨時履約，權利較多，所以最貴。"},{"c":"opt","q":[1197,986,870,627,412],"jy":"19","lo":0,"ex":"發行銀行一年後可以「隨時」用約定價格買回債券，等於銀行手上握有一個美式買權。"},{"c":"opt","q":[1018,934,806,718],"jy":"21","lo":0,"ex":"國內市場交易的權證是證券商發行的「備兌型權證」，不是發行公司用自家股票發行的「權益型權證」。"},{"c":"opt","q":[684,469,416,140],"jy":"19","lo":0,"ex":"亞洲式選擇權是在到期時，用一段期間的平均價來結算，屬於歐式的形式，不是美式。"},{"c":"opt","q":[916,771,397,210],"jy":"10","lo":0,"ex":"敏感度指標有 Delta、Gamma、Vega、Theta、Rho，沒有 Omega。衡量對波動率敏感度的是 Vega。"},{"c":"opt","q":[1138,779,479,289],"jy":"20","lo":0,"ex":"利率上限的賣方支付金額＝名目本金 ×(市場利率－上限利率)× 期間。本題為 2,000 萬 ×(3.2%－3%)× 3/12＝1 萬元。"},{"c":"opt","q":[937,756,343],"jy":"20","lo":0,"ex":"甲、乙兩張債券的浮動部分(6.90%－TAIBOR 和 TAIBOR－6.90%)剛好一正一負互相抵銷，CAP 也一加一減抵銷，平均下來只剩 7.50%。"},{"c":"opt","q":[864,743,440],"jy":"21","lo":0,"ex":"個股型權證的標的只有一檔股票；兩檔以上就是組合型權證。"},{"c":"opt","q":[990,749,113],"jy":"20","lo":0,"ex":"附上下限的浮動債券，對投資人來說＝浮動利率債券＋加碼，再「賣出」利率上限(利息最多只拿到上限)＋「買進」利率下限(利息至少有下限)。"},{"c":"opt","q":[850,705,251],"jy":"82","lo":0,"ex":"新臺幣匯率選擇權只能做陽春型(Plain Vanilla)，承作對象限法人，不能是自然人。"},{"c":"opt","q":[1056,873,304],"jy":"19","lo":0,"ex":"波動度上升，買權和賣權都更有機會賺錢，權利金都會上升。標的上漲、履約價降低、期間縮短，都會讓賣權變便宜。"},{"c":"opt","q":[968,849,609],"jy":"59","lo":0,"ex":"陽春型選擇權就是一般的買權、賣權，以及由它們組成的 Cap、Floor、Collar、Strips。數位選擇權(D q":[1132,299],"jy":"48","lo":0,"ex":"買入賣權的成本 20,000，年底價值 60,000，非避險按公允價值衡量，差額 40,000 列為利益。"},{"c":"acct","q":[1015,316],"jy":"47","lo":0,"ex":"現金流量避險中，避險工具有效部分的公允價值變動列入其他綜合損益，不是當期損益。"},{"c":"acct","q":[677,354],"jy":"44","lo":0,"ex":"IFRS 9 下遠期合約可以作為避險工具，也可以只指定即期價格部分、把利息部分排除。「遠期合約皆不適用」是錯的。"},{"c":"acct","q":[618,355],"jy":"45","lo":0,"ex":"嵌入式衍生工具的主契約不一定屬於 IFRS 9 範圍內的資產，也可能是負債、租賃、保險合約等。"},{"c":"acct","q":[1072,356],"jy":"48","lo":0,"ex":"收固定、付浮動的利率交換出現評價損失，代表這筆交換變成負債，分錄借記「透過損益按公允價值衡量之金融負債評價損失」。"},{"c":"acct","q":[715,400],"jy":"46","lo":0,"ex":"可分離的認股權是獨立的衍生工具，按公允價值 5,000 認列，剩下的 95,000 才是公司債。"},{"c":"acct","q":[953,497],"jy":"42","lo":0,"ex":"交換合約簽約時公允價值是 0，年底是 40。整年度的評價利益＝40－0＝40，中間月份的起伏會互相抵銷。"},{"c":"acct","q":[1101,537],"jy":"45","lo":0,"ex":"類似資產的活絡市場報價屬於第 2 級；相同資產的報價才是第 1 級。"},{"c":"acct","q":[892,594],"jy":"42","lo":0,"ex":"「持有供交易之金融負債評價調整」是負債的調整科目，屬於負債類。「評價損失」是損益類。"},{"c":"acct","q":[919,595],"jy":"45","lo":0,"ex":"結構型商品收的本金不是存款，就算和衍生工具分拆入帳，也不能分類為存款。"},{"c":"acct","q":[1160,713],"jy":"45","lo":0,"ex":"公允價值只有 3 個層級。第 1 層級是相同資產的活絡市場報價；第 2 層級包括類似資產的活絡市場報價；第 3 層級是不可觀察輸入值。"},{"c":"acct","q":[954,714],"jy":"48","lo":0,"ex":"發行選擇權收到的權利金，是承擔義務的對價，要列為負債，不是收入。"},{"c":"acct","q":[799,775],"jy":"44","lo":0,"ex":"賣出選擇權收到的權利金，訂約日要認列為持有供交易之金融負債，不能直接列為利益。"},{"c":"acct","q":[1099,832],"jy":"42","lo":0,"ex":"衍生性商品適用審慎性、一致性、經濟實質重於法律形式等原則，並採權責基礎，不是現金基礎。"},{"c":"acct","q":[956,837],"jy":"47","lo":0,"ex":"避險工具公允價值變動中無效的部分，直接認列為當期損益。"},{"c":"acct","q":[314,211],"jy":"40","lo":0,"ex":"敏感度分析是在衡量市場價格變動的影響，屬於市場風險資訊。到期時間偏流動性風險，擔保品和呆帳偏信用風險。"},{"c":"acct","q":[536],"jy":"43","lo":0,"ex":"賣出台指期貨，指數從 8,000 跌到 7,800，賺 200 點 × 200 元 × 10 口＝400,000，認列為持有供交易金融資產(借方)。"},{"c":"acct","q":[29],"jy":"48","lo":0,"ex":"以選擇權作為避險工具時，可以只指定選擇權的內含價值變動，把時間價值排除在外。"},{"c":"acct","q":[85],"jy":"48","lo":0,"ex":"賣出(發行)選擇權通常不能降低風險，一般不能作為避險工具，說「均可」是錯的。"},{"c":"acct","q":[835],"jy":"46","lo":0,"ex":"被避險項目可以是確定承諾、資產負債、高度很有可能的預期交易。衍生性商品本身通常是避險工具，不是被避險項目。"},{"c":"acct","q":[23],"jy":"46","lo":0,"ex":"舊規定(IAS 39)要求避險實際有效性介於 80% 至 125% 之間。"},{"c":"acct","q":[24],"jy":"46","lo":0,"ex":"非避險衍生工具的公允價值變動，一律計入當期損益。"},{"c":"acct","q":[26],"jy":"47","lo":0,"ex":"現金流量避險：有效部分列入其他綜合損益，無效部分列入當期損益。"},{"c":"acct","q":[358],"jy":"48","lo":0,"ex":"股票指定為 FVOCI，出售時的公允價值變動仍列在其他綜合損益，不轉入損益。從 212,000 到 216,000，貸記其他綜合損益 4,000。"},{"c":"acct","q":[359],"jy":"43","lo":0,"ex":"先算利息：帳面 104,580 × 有效利率 3%≈ 3,137，現金付出 4,000，差額 863 是溢價攤銷，借記該金融負債 863。"},{"c":"acct","q":[403],"jy":"48","lo":0,"ex":"這是替「已認列的債券」規避公允價值下跌，屬於公允價值避險；賣出公債期貨能抵銷債券下跌，是有效的公允價值避險。"},{"c":"acct","q":[430],"jy":"47","lo":0,"ex":"舊規定的高度有效範圍是 80% 至 125%，不是 75% 至 135%。"},{"c":"acct","q":[433],"jy":"45","lo":0,"ex":"重大使用不可觀察輸入值的公允價值，屬於第 3 級。"},{"c":"acct","q":[434],"jy":"41","lo":0,"ex":"賣出選擇權收取的權利金代表未來可能要履約的義務，非避險時認列為持有供交易之金融負債。"},{"c":"acct","q":[466],"jy":"47","lo":1,"ex":"到期時由 A 銀行選擇用美元或日圓支付，選擇權在 A 銀行手上，所以 A 銀行是選擇權的「買方」，客戶才是賣方。"},{"c":"acct","q":[534],"jy":"45","lo":0,"ex":"企業在首次成為合約一方時，就要評估嵌入式衍生工具是否需要和主契約分離。之後一般不需要每期重新評估。"},{"c":"acct","q":[535],"jy":"42","lo":0,"ex":"整張轉換公司債按 FVTPL 衡量。損益＝期末公允價值 1,013,000－期初 1,000,000＋利息 60,000＝73,000。"},{"c":"acct","q":[656],"jy":"46","lo":0,"ex":"非避險的遠期交易，公允價值從 0 變成負 5,000，差額直接認列為本期損失 5,000。"},{"c":"acct","q":[717],"jy":"46","lo":0,"ex":"符合公允價值避險後，被避險債券因利率變動的公允價值變動，也轉列當期損益，和避險工具的損益互相抵銷。"},{"c":"acct","q":[836],"jy":"44","lo":0,"ex":"依到期日列出負債要付錢的時間，是在揭露資金是否周轉得過來，屬於流動性風險的量化揭露。"},{"c":"acct","q":[1016],"jy":"45","lo":0,"ex":"相同衍生工具在活絡市場的未調整報價，屬於第一層級。"},{"c":"acct","q":[1073],"jy":"42","lo":0,"ex":"一致性原則：會計政策要前後一致，讓不同年度的財務報表可以比較。"},{"c":"acct","q":[1074],"jy":"47","lo":0,"ex":"「依避險會計指定且為有效避險工具之金融資產」是資產類。其他選項是負債、權益或損益科目。"},{"c":"acct","q":[465],"jy":"46","lo":1,"ex":"企業自己發行的股票、併購其他公司的承諾、企業持有的衍生性商品，這三項都不能作為被避險標的。可以的只有投資其他公司的股票。"},{"c":"law","q":[1124,1031,1060,1002,847,883,725,583,459,376,183,65,82],"jy":"72","lo":0,"ex":"自然人一般客戶只能做買方或低風險的陽春型商品：陽春型遠期外匯、買入陽春型匯率選擇權、外匯保證金、買入可轉債資產交換選擇權。涉及大陸地區時不含資產交換選擇權。「賣出」選擇權和 CDS 都不能做。"},{"c":"law","q":[1154,1033,791,792,764,487,380,331,193,202,103],"jy":"81","lo":0,"ex":"向央行申辦的程序常考配對：換匯交易、已經許可或備查的商品連結同一標的再組合(非複雜性高風險)，得不經申請逕行辦理；外幣保證金代客操作，開辦前申請許可；指定分行推介，總行開辦前函報備查；對專業機構投資人辦理尚未開放或開放未滿半年、未涉新臺幣的商品，以及開放已滿半年、未涉新臺幣的商品，都是開辦後函報備查。補充（依央行 114/7/15 外匯業務管理辦法問答集）：對專業機構投資人函報備查過的商品，不等於已經開放，要賣給其他客戶仍須開辦前申請許可。"},{"c":"law","q":[1142,853,782,670,375,255,190,78,41],"jy":"62","lo":0,"ex":"兩個數字別搞混：經辦人員的「資格條件」是課程時數 60 小時；「每年」在職教育訓練是至少 12 小時。"},{"c":"law","q":[1086,1025,881,582,246,69,43],"jy":"60","lo":0,"ex":"銀行申請開辦的條件：資本適足率符合規定、「沒有」備抵呆帳提列不足、上一季底逾放比 3% 以下、上一年度沒有重大違規。逾放比 5% 或「提列不足低於 3%」都是錯的。"},{"c":"law","q":[1127,909,882,667,458,374,330],"jy":"86","lo":0,"ex":"複雜性高風險商品的個別交易損失上限(平均單期名目本金的倍數)：匯率類 3.6 倍；非匯率類 12 期以下 6 倍、超過 12 期 9.6 倍。"},{"c":"law","q":[1184,967,541,369,326,37],"jy":"60","lo":0,"ex":"高淨值投資法人有兩個常考門檻：淨資產超過新臺幣 200 億元；或持有有價證券部位、衍生性商品投資組合達 10 億元以上(並符合其他條件)。看題目問的是淨資產還是投資部位。"},{"c":"law","q":[1122,1030,910,644,543,391],"jy":"62","lo":0,"ex":"外匯衍生性商品交易、行銷部門的經辦及相關管理人員，資格三選一（依央行 114/7/15 外匯業務管理辦法問答集）：參加國內金融訓練機構課程 60 小時以上並取得合格證書、在國內外金融機構相關業務實習一年、曾有半年以上相關業務實際經驗。通過銷售人員資格測驗不在其中，實習半年或課程 30 小時也不夠。推介人員則不同，可以用通過銷售人員或結構型商品測驗取得資格，國際業務執照不算。"},{"c":"law","q":[851,728,586,396,166],"jy":"63","lo":0,"ex":"匯率類複雜性高風險商品，個別交易損失上限＝平均單期名目本金(不計槓桿)× 3.6 倍，500 × 3.6＝1,800 千美元。2 年 24 期的題目是舊制題，現行規定匯率類的契約期限最長一年、最多 12 期。"},{"c":"law","q":[788,546,490,449,387],"jy":"83","lo":0,"ex":"未涉新臺幣的外匯衍生性商品，不得連結資產證券化商品、未公開上市的大陸個股或指數、私募有價證券等。可以連結櫃買中心或證交所編製的臺股指數。公開募集的有價證券不在禁止範圍內。"},{"c":"law","q":[1032,908,671,377,33],"jy":"73","lo":0,"ex":"到期或提前到期時，可以取回 100% 原計價幣別本金的，才叫保本型結構型商品。"},{"c":"law","q":[1061,704,584,184,38],"jy":"61","lo":0,"ex":"已核准的銀行開辦新商品，原則採事後備查，例外用負面表列要求事前核准。涉及須經央行許可的外匯商品，直接向中央銀行申請。"},{"c":"law","q":[854,489,333,102,46],"jy":"73","lo":0,"ex":"現行規定：不保本型結構型商品對「自然人的一般客戶」設有最低交易門檻，一律為等值 1 萬美元；自然人專業客戶沒有門檻，保本型也沒有門檻（依央行 114/7/15 外匯業務管理辦法問答集）。舊期出現 2 萬、5 萬美元的答案是舊規定，現在一律以 1 萬美元為準。"},{"c":"law","q":[1034,668,551,522,189],"jy":"59","lo":0,"ex":"複雜性高風險商品是指結構複雜、隱含賣出選擇權的商品，例如觸及出場遠期合約(TRF 類)。一般的交換契約、結構型商品、多筆陽春型選擇權，不屬於複雜性高風險商品。"},{"c":"law","q":[1146,1087,940,846,327],"jy":"86","lo":0,"ex":"期初保證金最低標準：複雜性高風險商品不得低於總名目本金的 2%。題目若特別講期限超過一年且隱含賣出選擇權的匯率類商品，答案是 5%。"},{"c":"law","q":[1125,843,198,60],"jy":"61","lo":0,"ex":"銀行只能做「避險」的情形：最近一季底逾放比率超過 3%、資本適足率不符規定，或備抵呆帳提列不足。選項裡逾放比 5% 或 6% 已超過 3%，就是答案。"},{"c":"law","q":[1029,608,483,71],"jy":"61","lo":0,"ex":"評價頻率分兩種：交易部位要每日以市價評估；銀行本身業務需要的避險性交易，至少每月評估一次。"},{"c":"law","q":[1147,763,424,392],"jy":"63","lo":0,"ex":"有價證券抵繳期初保證金時，其標的範圍、評價方式和折扣比率，至少每年評估檢討一次。"},{"c":"law","q":[727,545,372,187],"jy":"80","lo":0,"ex":"無本金交割新臺幣遠期外匯(NDF)要先向央行申請許可才能做。一般的新臺幣遠期外匯、換匯不用。"},{"c":"law","q":[973,368,260,154],"jy":"79","lo":0,"ex":"新臺幣 NDF 加上新臺幣匯率選擇權的合計部位，不得超過總部位限額的五分之一。"},{"c":"law","q":[844,601,336,63],"jy":"71","lo":0,"ex":"對一般客戶銷售結構型商品，要提供產品說明書和客戶須知，並宣讀重要內容、錄音留存(或用電子設備說明)。專業客戶不一定要提供產品說明書，所以寫「一般及專業客戶都要提供」是錯的。"},{"c":"law","q":[1143,1023,603,580],"jy":"72","lo":0,"ex":"交易文件要提醒客戶的重點包括：條件不同風險不同、現金交割可能損失利息或本金、非現金交割本金可能被轉換成標的資產。「再投資風險」不是規定的提醒事項。"},{"c":"law","q":[1145,1065,549,34],"jy":"64","lo":0,"ex":"結構型商品不能用「存款」的名義銷售，以免客戶誤以為有存款保障，所以不能叫結構型優利存款。"},{"c":"law","q":[966,422,182,36],"jy":"71","lo":0,"ex":"重要事項摘要包含商品中文名稱、風險等級、審閱期間等。「最大可能損失」不在重要事項摘要的列舉項目中。"},{"c":"law","q":[721,454,180,61],"jy":"74","lo":0,"ex":"委託國外機構避險時，合約要求對手避免利益衝突、避免損及客戶權益、避免影響市場行情。沒有規定要避免交易期限太長。"},{"c":"law","q":[790,722,201,62],"jy":"72","lo":0,"ex":"客戶須知載明的保護方式：申訴管道、爭議訴訟處理方式、向金管會申訴。沒有向縣市政府消費者服務中心或消保中心申訴。"},{"c":"law","q":[1121,1001,526,64],"jy":"72","lo":0,"ex":"可能導致本金損失的情況包括：利率匯率市價變動、銀行或他人的業務財產狀況變化、影響判斷的重要事項。「投資人自己的認知變化」不算。"},{"c":"law","q":[1006,947,450,93],"jy":"59","lo":0,"ex":"這個管理辦法規範的是銀行在國內辦理的衍生性商品。境外結構型商品另有專法規範，不包括在內。"},{"c":"law","q":[912,783,600,244],"jy":"71","lo":0,"ex":"產品說明書要記載計價幣別、交易日、生效日、到期日、保本率、連結標的等。「延後到期的約定」不是規定的記載事項。"},{"c":"law","q":[941,604,544,325],"jy":"59","lo":0,"ex":"「外匯業務管理辦法」的授權依據是中央銀行法；「衍生性金融商品內部作業管理辦法」的授權依據是銀行法。"},{"c":"law","q":[848,726,607,328],"jy":"65","lo":0,"ex":"衍生性商品交易資訊要申報給櫃買中心、聯合徵信中心等。本題選項中不包括中央銀行。"},{"c":"law","q":[1090,824,587,382],"jy":"52","lo":0,"ex":"風險容忍度和業務承作限額，由董(理)事會審定。"},{"c":"law","q":[1148,904,666,484],"jy":"83","lo":0,"ex":"大額結匯的通報門檻現在是同一客戶、同一訂約日的即期結匯併計達等值 100 萬美元，不分個人或公司（依央行 114/7/15 外匯業務管理辦法問答集）。舊期答案 50 萬美元是舊規定，以最新第 20 期的 100 萬美元為準。另外，現行傳送時間是訂約日的次一營業日中午 12 時前，不是訂約日立即傳送。"},{"c":"law","q":[1180,960,840,610],"jy":"59","lo":0,"ex":"客戶承作半年、每月比價，隱含賣出選擇權的商品，屬於複雜性高風險商品。"},{"c":"law","q":[905,820,165],"jy":"81","lo":0,"ex":"無本金交割新臺幣遠期外匯(NDF)的承作對象限於銀行之間(指定銀行、海外分行等)，不是國內外法人。"},{"c":"law","q":[552,105,56],"jy":"82","lo":0,"ex":"新臺幣與外幣間換匯換利交易(CCS)的承作對象是國內外法人，不限國內法人。"},{"c":"law","q":[1186,664,31],"jy":"61","lo":0,"ex":"交易部位的評價頻率是每日以市價評估；避險部位才是至少每月評估一次。"},{"c":"law","q":[1067,386,162],"jy":"61","lo":0,"ex":"新種複雜性高風險商品，商品審查小組審定後，還要提報董(理)事會或常務董(理)事會通過才能辦理。"},{"c":"law","q":[1026,762,520],"jy":"60","lo":0,"ex":"專業客戶包括專業機構投資人、高淨值投資法人、總資產超過新臺幣 1 億元的法人或基金等。題目寫 5,000 萬元的境外法人，門檻不對。"},{"c":"law","q":[729,101,58],"jy":"82","lo":0,"ex":"NDF 的承作對象：國內指定銀行之間、本國銀行與其海外分行、外國銀行在臺分行與其總行及分行、外國銀行在臺子行與其母行及分行，以上都可以。"},{"c":"law","q":[913,383,262],"jy":"82","lo":0,"ex":"新臺幣匯率選擇權只能做陽春型，承作對象限國內外法人，不能對自然人，也不能未經許可做組合式商品。"},{"c":"law","q":[395,263,205],"jy":"56","lo":0,"ex":"匯率類複雜性高風險商品的個別交易損失上限＝平均單期名目本金(不計槓桿)× 3.6＝100 萬 × 3.6＝3.6 百萬美元。"},{"c":"law","q":[669,252,77],"jy":"60","lo":0,"ex":"法人或基金最近一期財報總資產超過新臺幣 1 億元，可以書面申請成為專業客戶。"},{"c":"law","q":[1093,381,321],"jy":"60","lo":0,"ex":"高淨值投資法人的條件之一：財報上持有有價證券部位或衍生性商品投資組合達新臺幣 10 億元以上。"},{"c":"law","q":[1081,660,40],"jy":"59","lo":0,"ex":"複雜性高風險商品是指結算或比價期數「超過 3 期」，而且隱含賣出選擇權特性的商品。"},{"c":"law","q":[823,647,44],"jy":"72","lo":0,"ex":"產品說明書要說明最低收益、費用、交易糾紛申訴管道等。「客戶申請延後終止日期」不是規定的記載事項。"},{"c":"law","q":[367,247,59],"jy":"81","lo":0,"ex":"首次辦理、尚未開放或開放未滿半年的商品、涉及新臺幣匯率的商品，都要開辦前申請許可。提供境外衍生性商品的資訊及諮詢服務不屬於這一類。"},{"c":"law","q":[665,250,74],"jy":"80","lo":0,"ex":"依管理外匯條例，外匯業務的行政主管機關是金管會；中央銀行則是掌理外匯業務的機關。"},{"c":"law","q":[1185,521,80],"jy":"61","lo":0,"ex":"已取得核准的銀行，在第一家銀行核准後，申請辦理臺股股權以外、衍生自國內股價及期交所相關現貨和指數的商品，送件次日起十日內金管會沒表示反對，就可以逕行辦理。"},{"c":"law","q":[886,767,99],"jy":"82","lo":0,"ex":"新臺幣與外幣間換匯交易，國內法人不需要檢附文件，而且不計入當年累積結匯金額。"},{"c":"law","q":[942,612,248],"jy":"61","lo":0,"ex":"總行授權指定分行辦理推介業務，是採函報備查，不需要申請許可。NDF、涉及新臺幣匯率的商品、外幣保證金代客操作都要先申請許可。"},{"c":"law","q":[1028,606,249],"jy":"63","lo":0,"ex":"銀行不得和自然人客戶承作複雜性高風險商品。"},{"c":"law","q":[971,825,339],"jy":"73","lo":0,"ex":"不保本型結構型商品賣給自然人一般客戶，到期結算金額應達原計價幣別本金的 70% 以上，不是 60%。"},{"c":"law","q":[902,723,365],"jy":"73","lo":0,"ex":"自然人一般客戶買結構型商品，要看投資經驗或金融相關工作經歷，沒有規定要大專學歷。"},{"c":"law","q":[663,482,371],"jy":"62","lo":0,"ex":"給非專業客戶的高風險衍生性商品交易額度，不得超過客戶可驗證往來資力的 250%。"},{"c":"law","q":[786,542,423],"jy":"61","lo":0,"ex":"業務人員酬金不能直接和特定商品銷售業績連結，也不能只看財務指標，要納入是否有客戶紛爭等非財務指標。"},{"c":"law","q":[1094,911,488],"jy":"73","lo":0,"ex":"自然人一般客戶的外匯保證金交易槓桿倍數，由各銀行評估風險後自行訂定。"},{"c":"law","q":[1150,1123,645],"jy":"64","lo":0,"ex":"交易糾紛無法在銀行內部和解時，一般客戶(不分自然人或法人)都可以向金融消費評議中心申請評議。"},{"c":"law","q":[1140,900,780],"jy":"60","lo":0,"ex":"銀行申請開辦衍生性商品業務的財務條件，是申請日上一季底逾放比率在 3% 以下(另有資本適足率、備抵呆帳等條件)，跟 EPS、ROE、市值無關。"},{"c":"law","q":[1141,1021,781],"jy":"71","lo":0,"ex":"宣讀客戶須知時要說明投資風險。不能談未來績效或市場走勢看法，以免變成推銷或保證。"},{"c":"law","q":[1144,1024,845],"jy":"65","lo":0,"ex":"A 錯：客戶風險承受程度要至少區分「三個」等級。B 錯：七日審閱期間是保護一般(非專業)客戶的規定。C 是對的：只限專業客戶的結構型商品，不得做一般性廣告。"},{"c":"law","q":[903,703],"jy":"62","lo":0,"ex":"本國銀行國外分行與境外法人(非專業機構投資人)的交易額度，要報送金融聯合徵信中心。"},{"c":"law","q":[965,842],"jy":"52","lo":0,"ex":"交易部位即時或每日評估；銀行本身業務需要的避險性交易，至少每 1 個月評估一次。"},{"c":"law","q":[789,379],"jy":"65","lo":0,"ex":"因避險買入的股票等可以不計入投資限額，但持有每一家公司的股份總數仍不得超過已發行股份的 5%。"},{"c":"law","q":[276,161],"jy":"54","lo":0,"ex":"非避險交易的曝險超過客戶淨值時，客戶提供的擔保品必須是高流動性的資產，不能用流動性低的不動產。另一種問法中，官方認定「避險交易應徵提具體明確之避險證明文件」的說法不正確。"},{"c":"law","q":[662,324],"jy":"74","lo":0,"ex":"結合存款的結構型商品，存款成分不一定有 100% 保障，說「均有 100% 保障」是錯的。"},{"c":"law","q":[944,680],"jy":"63","lo":0,"ex":"平均單期名目本金＝(6 × 100 萬＋6 × 50 萬)÷ 12＝75 萬。匯率類損失上限＝75 萬 × 3.6＝270 萬美元。"},{"c":"law","q":[787,73],"jy":"64","lo":0,"ex":"為了避免誤售給不適合的客戶，銀行要建立商品適合度制度，把商品風險和客戶風險承受度配對。"},{"c":"law","q":[253,191],"jy":"58","lo":0,"ex":"揭露的風險資訊要包含「最大損失金額」，讓客戶知道最壞情況會賠多少。"},{"c":"law","q":[1089,373],"jy":"72","lo":0,"ex":"對法人專業客戶，風險揭露程序可以依銀行內部作業程序辦理，不用像一般客戶那麼嚴格。"},{"c":"law","q":[793,456],"jy":"62","lo":0,"ex":"這裡的經辦及管理人員指前台從事交易、推介的人員，中後台的風險控管、交割、會計部門不包括在內。"},{"c":"law","q":[841,602],"jy":"60","lo":0,"ex":"專業法人或基金的條件：最近一期財報總資產超過新臺幣 1 億元，並以書面申請。"},{"c":"law","q":[194,100],"jy":"84","lo":0,"ex":"自然人透過帳戶買賣人民幣，每人每日不得超過人民幣 2 萬元。"},{"c":"law","q":[261,57],"jy":"79","lo":0,"ex":"依官方答案，錯誤的是第 (3) 項：海外分行受理 1,000 萬美元以上 NDF「訂約日立即傳送」這個說法。補充現行規定（依央行 114/7/15 外匯業務管理辦法問答集）：即期結匯是同一客戶同一訂約日併計達 100 萬美元，遠匯、換匯、換匯換利是單筆達 100 萬美元，都要在訂約日次一營業日中午 12 時前傳送，逾時視為漏傳。題目選項中寫「訂約日立即傳送」的是舊規定。"},{"c":"law","q":[1182,642],"jy":"82","lo":0,"ex":"NDF 到期一律以差額交割，不能選擇全額交割。DF 則是全額交割。"},{"c":"law","q":[550,196],"jy":"82","lo":0,"ex":"NDF 不得展期，也不得提前解約，到期一律現金差價交割。"},{"c":"law","q":[884,329],"jy":"72","lo":0,"ex":"風險預告書要揭露市場價格風險、信用風險、法律風險等，作業風險不是必要揭露項目。"},{"c":"law","q":[1027,30],"jy":"64","lo":0,"ex":"和一般客戶的交易糾紛內部無法和解時，可以向金融消費評議中心申請評議。"},{"c":"law","q":[524,35],"jy":"63","lo":0,"ex":"評估客戶風險承受程度要看知識、投資經驗、交易目的、財務狀況等，不看學歷。"},{"c":"law","q":[378,42],"jy":"84","lo":0,"ex":"衍生性商品的評議金額在新臺幣 100 萬元以下時，銀行應該接受評議決定。"},{"c":"law","q":[523,45],"jy":"63","lo":0,"ex":"客戶最大損失上限只適用於「非避險」的複雜性高風險商品。每日評價、最高風險評級、告知重要內容，避險和非避險都要做。"},{"c":"law","q":[827,70],"jy":"80","lo":0,"ex":"KYC、客戶分級、商品審查分級、商品適合度這些規範由金管會負責；但整體外匯衍生性商品業務，是金管會與中央銀行共同監理。看清楚題目問的是哪一種。"},{"c":"law","q":[1088,75],"jy":"81","lo":0,"ex":"取得外匯業務許可後超過六個月還沒開辦，中央銀行可以命其停辦、廢止或撤銷許可。"},{"c":"law","q":[784,181],"jy":"74","lo":0,"ex":"錄音紀錄至少保存到商品存續期間再加 3 個月，而且至少保存 5 年。"},{"c":"law","q":[1062,186],"jy":"65","lo":0,"ex":"國際金融業務分行(OBU)的交易幣別限外幣，不包括新臺幣。"},{"c":"law","q":[1187,188],"jy":"81","lo":0,"ex":"外幣間遠期外匯和換匯交易展期時，要依「當時市價」重新訂價，不能用原價格展期。"},{"c":"law","q":[1151,199],"jy":"64","lo":0,"ex":"提供結構型商品給屬自然人的一般客戶，銀行要提供市價評估資訊。"},{"c":"law","q":[1063,256],"jy":"86","lo":0,"ex":"複雜性高風險商品每筆交易的期初保證金，不得低於契約總名目本金的 2%。"},{"c":"law","q":[366,323],"jy":"86","lo":0,"ex":"申請辦理衍生性商品業務，申請日上一季底逾放比率要在 3% 以下。"},{"c":"law","q":[385,332],"jy":"57","lo":0,"ex":"屬法人的一般客戶做過一次結構型商品後，之後同類型交易可以經客戶逐次書面同意，免宣讀和錄音。自然人客戶不適用。"},{"c":"law","q":[480,360],"jy":"51","lo":0,"ex":"已核准辦理衍生性商品業務的銀行，除了需要事先核准的商品，可以先開辦，開辦後 15 日內報金管會備查。"},{"c":"law","q":[441,362],"jy":"74","lo":0,"ex":"客戶如果不願意接受風險屬性分析，銀行就不能和他承作，不能因此免除 KYC。"},{"c":"law","q":[421,388],"jy":"45","lo":0,"ex":"結構型商品收的本金不能用存款名義，但仍須向中央銀行繳交存款準備金(外幣本金按其他各種負債提存)。"},{"c":"law","q":[661,390],"jy":"65","lo":0,"ex":"境外結構型商品發行機構的分公司，指經金管會核准設立的外國銀行在臺分行、外國券商在臺分公司或外國保險公司在臺分公司。"},{"c":"law","q":[731,420],"jy":"72","lo":0,"ex":"自然人一般客戶可以做外匯保證金、陽春型遠期外匯、保本型結構型商品。不保本的雙元貨幣如果比價期間超過一年，不得提供。"},{"c":"law","q":[605,481],"jy":"59","lo":0,"ex":"這個管理辦法規範銀行辦理的期貨、選擇權、結構型商品等。結構型債券屬於有價證券，另有規範，不適用。"},{"c":"law","q":[1085,527],"jy":"60","lo":0,"ex":"董(理)事會至少每年檢討一次衍生性商品業務的經營策略和作業準則。"},{"c":"law","q":[945,548],"jy":"81","lo":0,"ex":"開放已滿半年、且未涉及新臺幣匯率的外匯衍生性商品，可以開辦後再函報備查。補充（依央行 114/7/15 外匯業務管理辦法問答集）：開放已滿半年的結構型商品或組合式契約，就算裡面的單項商品銀行還沒申請過，也一樣是開辦後函報備查。"},{"c":"law","q":[1003,581],"jy":"73","lo":0,"ex":"保本型結構型商品賣給自然人一般客戶，計價幣別可以包含人民幣，說「不得為人民幣」是錯的。"},{"c":"law","q":[961,611],"jy":"82","lo":0,"ex":"涉及新臺幣匯率的遠期外匯，到期展期時要依「當時市價」，不能用原價格展期。"},{"c":"law","q":[1092,646],"jy":"83","lo":0,"ex":"已經許可或備查的外幣衍生性商品，擴增到涉及人民幣或大陸地區標的，可以逕行辦理。"},{"c":"law","q":[826,672],"jy":"70","lo":0,"ex":"遠期外匯的損益變化單純，可以用一次性的說明分析。賣出選擇權、TRF、觸及出場遠期合約比較複雜，要逐一說明。"},{"c":"law","q":[962,700],"jy":"83","lo":0,"ex":"外匯信用違約交易的規定中，承作對象並不是以「限法人客戶」的方式規範，所以這項錯誤。"},{"c":"law","q":[901,702],"jy":"64","lo":0,"ex":"一般客戶一年內衍生性商品交易少於 5 筆、而且年齡 70 歲以上，銀行不得主動推介。"},{"c":"law","q":[943,706],"jy":"73","lo":0,"ex":"本金連結黃金選擇權的不保本型商品，產品期限不超過 6 個月，交易門檻是等值 1 萬美元以上，不是 2 萬美元。"},{"c":"law","q":[946,707],"jy":"74","lo":0,"ex":"客戶有評價損失時，銀行要定期監控、客戶可以要求市價評估資訊。「信用無虞仍要確認有足夠保證金才能承作新交易」不是規定內容。"},{"c":"law","q":[1084,724],"jy":"64","lo":0,"ex":"受託或銷售機構要提供非專業投資人不少於七日的審閱期間。"},{"c":"law","q":[1007,734],"jy":"58","lo":0,"ex":"保本型可以連結證交所或櫃買中心公布、非以臺股為主要成分股的指數。不能連結新臺幣匯率指標、本國企業在國外發行的有價證券、未經核准募集的商品。"},{"c":"law","q":[1083,760],"jy":"51","lo":0,"ex":"已核准的銀行開辦一般衍生性商品，開辦後 15 日內報金管會備查。"},{"c":"law","q":[1005,765],"jy":"64","lo":0,"ex":"可承作上限＝可驗證資力 × 250%＝2,500 萬。每筆 TRF 曝險＝50 萬 × 12 次 × 2 倍 × 5%＝60 萬。2,500 ÷ 60≈ 41.7，最多 41 筆。"},{"c":"law","q":[914,766],"jy":"83","lo":0,"ex":"非專業機構投資人的國內法人專業客戶，只能擔任信用風險的「買方」(買保護)，不能當承擔風險的賣方。"},{"c":"law","q":[1149,852],"jy":"80","lo":0,"ex":"以外幣計價、以外幣交割、連結國外風險標的，三種都算「涉及外匯」。"},{"c":"law","q":[1020,880],"jy":"80","lo":0,"ex":"以期貨交易人身分辦理未涉及新臺幣匯率的期貨交易，可以逕行辦理。NDF、外幣保證金代客操作等都要申請。"},{"c":"law","q":[1153,1066],"jy":"61","lo":0,"ex":"利害關係人的信用衍生性交易，要經董事會三分之二以上董事出席、出席董事四分之三以上同意。題目把出席和同意的比例講反了。"},{"c":"law","q":[363],"jy":"82","lo":0,"ex":"新臺幣與外幣間換匯交易，國內法人不需要檢附文件。"},{"c":"law","q":[974],"jy":"81","lo":0,"ex":"新臺幣與外幣間遠期外匯要依實際外匯收支需要訂期限，同一筆需求不能重複簽約，展期要依當時市價。"},{"c":"law","q":[640],"jy":"80","lo":0,"ex":"連結同一風險標的、用相同交易契約再組合，例如已核准的外幣匯率選擇權，再組合多個外幣匯率選擇權，可以逕行辦理（依央行 114/7/15 外匯業務管理辦法問答集）。匯率選擇權加利率選擇權是不同風險標的，選擇權組成期貨或遠匯組成換匯是不同交易契約，都不算。"},{"c":"law","q":[453],"jy":"82","lo":0,"ex":"新臺幣與外幣間換匯換利(CCS)的承作對象以法人為限，不是自然人。"},{"c":"law","q":[104],"jy":"84","lo":0,"ex":"評議金額在新臺幣 100 萬元以內，銀行應接受評議決定。"},{"c":"law","q":[821],"jy":"82","lo":0,"ex":"結構型商品收的外幣本金，按「其他各種負債」提存準備金，準備率 0.125%。"},{"c":"law","q":[455],"jy":"56","lo":0,"ex":"產品說明書和風險預告書要在交易「前」提供給客戶，不是交易完成後。"},{"c":"law","q":[720],"jy":"74","lo":0,"ex":"結合存款的結構型商品要揭露商品整體報酬和最大損失。"},{"c":"law","q":[794],"jy":"60","lo":0,"ex":"高淨值投資法人的財務門檻是「淨資產」超過新臺幣 200 億元，不是總資產。"},{"c":"law","q":[887],"jy":"60","lo":0,"ex":"高淨值投資法人要淨資產超過 200 億元；總資產超過 1 億元是一般專業法人的門檻。"},{"c":"law","q":[76],"jy":"84","lo":0,"ex":"非共同營業時間辦理外匯業務，每筆結匯金額要未達新臺幣 50 萬元或等值外幣。"},{"c":"law","q":[525],"jy":"63","lo":0,"ex":"一般複雜性高風險商品的期初保證金是 2%；期限超過一年、隱含賣出選擇權的匯率類商品要 5%。"},{"c":"law","q":[364],"jy":"63","lo":0,"ex":"複雜性高風險商品不能賣給自然人；一般法人只有在避險目的下可以承作。"},{"c":"law","q":[485],"jy":"63","lo":0,"ex":"匯率類複雜性高風險商品的契約期限不得超過一年，比價期數不得超過 12 期。"},{"c":"law","q":[547],"jy":"63","lo":0,"ex":"匯率類複雜性高風險商品：契約期限不超過一年、比價或結算期數不超過 12 期。"},{"c":"law","q":[134],"jy":"52","lo":1,"ex":"我國主要金融業從 102 年度開始，依國際財務報導準則(IFRSs)編製財務報告。"},{"c":"law","q":[254],"jy":"52","lo":0,"ex":"商品審查規範要記載會計方法、客戶權益保障、經營策略與業務方針等。業務人員績效獎酬制度另有規定，不在商品審查規範裡。"},{"c":"law","q":[322],"jy":"66","lo":0,"ex":"產品說明書要明確易懂、有時效性、風險揭露淺顯易懂，沒有規定費用要用紅字標記。"},{"c":"law","q":[335],"jy":"70","lo":0, 程是執行交易、確認交易、辦理交割、文件歸檔。建立資金備償計畫屬於流動性風險管理。"},{"c":"law","q":[209],"jy":"10","lo":1,"ex":"大部分衍生性商品是以「現金」(差額)交割，只有少部分是實物交割，題目講反了。"},{"c":"law","q":[240],"jy":"61","lo":0,"ex":"已開放一段期間(滿半年以上)的外匯衍生性商品，可以採事後報備。連結新臺幣匯率、首案、尚未開放的商品都要事先申請許可。"},{"c":"law","q":[241],"jy":"59","lo":0,"ex":"複雜性高風險商品的定義：結算或比價期數超過 3 期，而且隱含賣出選擇權特性。"},{"c":"law","q":[242],"jy":"82","lo":0,"ex":"NDF 不得展期、不得提前解約，交易對象限銀行之間，不能用保證金交易。"},{"c":"law","q":[243],"jy":"53","lo":1,"ex":"銷售推介人員不得用誇大宣傳謀取自身利益。"},{"c":"law","q":[257],"jy":"59","lo":0,"ex":"專業機構投資人不能要求變為一般客戶。其他專業法人和專業自然人可以書面要求改為一般客戶。"},{"c":"law","q":[258],"jy":"76","lo":1,"ex":"本題錯誤選項是關於「一萬美元以下即期匯率揭示」的敘述，不是規定內容。其他三項都是外匯衍生性商品的正確規範。"},{"c":"law","q":[277],"jy":"59","lo":0,"ex":"本國銀行國外分行也適用：要向聯徵中心報送交易額度、向指定機構申報交易資訊、遵守臺股股權衍生性商品的相關規定。所以全部都對。"},{"c":"law","q":[278],"jy":"82","lo":0,"ex":"遠期外匯要憑「實際外匯收支」的交易文件，例如發票、提單、主管機關核准文件。外幣定存單不是實際外匯收支證明。官方公告本題答 3 或 4 都給分。"},{"c":"law","q":[279],"jy":"82","lo":0,"ex":"換匯交易是同時做一筆即期和一筆方向相反的遠期交易，不是單純的即期外匯交易。"},{"c":"law","q":[320],"jy":"81","lo":0,"ex":"遠期外匯、換匯、已經許可或備查的商品可以逕行辦理。NDF 必須先申請許可。"},{"c":"law","q":[334],"jy":"63","lo":0,"ex":"複雜性高風險商品不是只限避險目的的專業法人。專業客戶也可以做非避險交易，一般法人才限避險目的。"},{"c":"law","q":[337],"jy":"83","lo":0,"ex":"外匯信用違約交換和信用違約選擇權，承作對象並不是只限專業客戶，所以這項錯誤。"},{"c":"law","q":[361],"jy":"78","lo":0,"ex":"外幣保證金不得收受非本人所有的定存或其他擔保品設質。"},{"c":"law","q":[370],"jy":"59","lo":0,"ex":"複雜性高風險商品是比價期數超過三期、隱含賣出選擇權的商品。期貨、遠期、陽春型選擇權都不是。"},{"c":"law","q":[393],"jy":"55","lo":0,"ex":"對一般專業客戶提供複雜性高風險商品時，要告知重要內容並錄音或錄影。專業機構投資人和高淨值投資法人不用。"},{"c":"law","q":[451],"jy":"64","lo":0,"ex":"期初保證金和追繳保證金機制，不只針對一般客戶，對專業機構投資人和高淨值投資法人以外的客戶都要訂定。"},{"c":"law","q":[452],"jy":"82","lo":0,"ex":"遠期外匯要依實際外匯收支需要訂定期限，不能由雙方隨意合議約定。"},{"c":"law","q":[486],"jy":"71","lo":0,"ex":"商品名稱可以加註原文名稱，規定是中文名稱不得有保本字樣、要標示風險等級、是否限專業客戶。"},{"c":"law","q":[491],"jy":"83","lo":0,"ex":"信用結構型商品的承作對象限專業客戶，不能賣給一般客戶。"},{"c":"law","q":[492],"jy":"65","lo":0,"ex":"OBU 辦理衍生性商品，仍要遵守「銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法」。"},{"c":"law","q":[540],"jy":"72","lo":0,"ex":"客戶須知要記載商品內容摘要、投資風險說明、市價評估說明等。不能放   <p class="sub" id="sync" style="font-weight:700;color:var(--teal)">${syncMsg()}</p><div class="stats"><div class="stat"><b>${all.d}</b><span>已作答題數</span></div><div class="stat"><b>${all.d?Math.round(all.o/all.d*100):0}%</b><span>答對率</span></div></div>
  <button class="exambtn" onclick="go({name:'examSel'})">模擬考：整期 60 題、計分${st.cur?'（有一份考到一半）':''}</button>
  <button class="wrongbtn" onclick="startWrong()">錯題本：${st.wrong.length} 題${st.wrong.length?'，點這裡複習':''}</button>
  <label class="toggle"><input type="checkbox" ${st.onlyRep?'checked':''} onchange="st.onlyRep=this.checked;save();render()">只看考過 2 次以上的考點（先拿高頻分）</label>`;
  CH.forEach(c=>{
    const vg=visGroups(c.id);const qs=vg.flatMap(x=>x.g.q);const s=stat(qs);
    h+=`<button class="ch" onclick="go({name:'ch',c:'${c.id}'})"><div class="t">${c.name}</div><div class="m">${vg.length} 個考點・${qs.length} 題・已答 ${s.d}</div><div class="bar"><i style="width:${qs.length?s.d/qs.length*100:0}%"></i></div></button>`;
  });
  h+=`<div class="xfer"><div class="kp"><b>搬移進度</b>（線上版和手機離線版之間）</div><button class="back" onclick="exportProg()">複製我的進度碼</button> <button class="back" onclick="importProg()">貼上進度碼匯入</button></div><p class="ver">離線版　版本：115/10/01</p><button class="reset" onclick="if(confirm('清除所有作答紀錄與錯題本？')){st.ans={};st.wrong=[];save();render()}">清除作答紀錄</button>`;
  app.innerHTML=h;
}
function chapter(){
  const vg=visGroups(view.c);
  let h=`<div class="top"><button class="back" onclick="go({name:'home'})">‹ 目錄</button><div class="ttl">${CHN[view.c]}</div></div>`;
  if(!vg.length){app.innerHTML=h+'<div class="empty">這一章沒有重複考點。取消首頁的「只看考過 2 次以上」就能看到全部題目。</div>';return;}
  h+=`<button class="start" onclick="startGroup('${view.c}',0)">從第一個考點開始刷</button>`;
  vg.forEach((x,k)=>{const s=stat(x.g.q);const n=x.g.q.length;
    h+=`<button class="grp" onclick="startGroup('${view.c}',${k})"><div class="s">${esc(QS[x.g.q[0]][2])}</div><div class="m"><span class="freq ${n>1?'':'one'}">考過 ${n} 次</span>${s.d===n?`<span class="done">已完成 ${s.o}/${n}</span>`:s.d?`<span>已答 ${s.d}/${n}</span>`:''}</div></button>`;});
  app.innerHTML=h;
}
function startGroup(c,k){const vg=visGroups(c);const list=[];vg.forEach((x,gk)=>x.g.q.forEach((q,j)=>list.push({q,gi:x.i,gk,j,n:x.g.q.length})));
  let pos=list.findIndex(it=>it.gk===k);go({name:'quiz',mode:'ch',c,list,pos,picked:null});}
function startWrong(){if(!st.wrong.length){alert('錯題本目前是空的。答錯的題目會自動收進來。');return;}
  const gOf={};GS.forEach((g,i)=>g.q.forEach(q=>gOf[q]=i));
  const list=st.wrong.slice().map(q=>({q,gi:gOf[q]}));
  go({name:'quiz',mode:'wrong',list,pos:0,picked:null});}
function quiz(){
  const it=view.list[view.pos];
  if(!it){app.innerHTML=`<div class="top"><button class="back" onclick="go({name:'home'})">‹ 目錄</button></div><div class="empty">${view.mode==='wrong'?'錯題本這一輪刷完了！答對的題目已經移出錯題本。':'這一章刷完了！回目錄換下一章。'}</div>`;return;}
  const q=QS[it.q],g=GS[it.gi],c=g.c;const p=view.picked;
  let h=`<div class="top"><button class="back" onclick="go(${view.mode==='wrong'?"{name:'home'}":"{name:'ch',c:'"+c+"'}"})">‹ 返回</button><div class="ttl">${view.mode==='wrong'?'錯題本 '+(view.pos+1)+' / '+view.list.length:CHN[c]}</div></div>`;
  if(view.mode==='ch')h+=`<div class="kp">第 ${it.gk+1} 個考點・<b>同考點第 ${it.j+1} / ${it.n} 題</b></div>`;
  else h+=`<div class="kp">${CHN[c]}</div>`;
  h+=`<div class="qcard"><span class="src">第 ${q[0]} 期　第 ${q[1]} 題</span><p class="stem">${esc(q[2])}</p>`;
  q[3].forEach((o,k)=>{const n=k+1;let cls='';
    if(p!==null){if(okAns(it.q,n)&&q[4]!==0)cls='right';else if(n===p)cls='wrong';}
    h+=`<button class="opt ${cls}" ${p!==null?'disabled':''} onclick="pick(${n})"><span class="n">${n}</span><span>${esc(o)}</span></button>`;});
  if(p!==null){const ok=okAns(it.q,p);
    h+=`<div class="fb ${ok?'ok':'no'}"><p><b>${ok?'答對了':'答錯了，已收進錯題本'}</b></p><p>正確答案：${esc(ansText(it.q))}</p>${q[5]?`<p>${esc(q[5])}</p>`:''}</div>`;
        const body=`${g.ex?`<p>${esc(g.ex)}</p>`:`<p class="muted">這個考點的說明還沒補上，</p>`}`;
    h+=ok?`<details class="exp"><summary>看說明</summary>${body}</details>`:`<div class="exp open"><div class="eh">為什麼是這個答案</div>${body}</div>`;
    if(c==='law')h+=`<div class="law">法規題可能因修法改答案，同考點以期數最新的那題為準。</div>`;}
  h+=`</div>`;
  h+=`<div class="nav"><button class="p" onclick="move(-1)" ${view.pos===0?'disabled':''}>上一題</button><button class="n2" onclick="move(1)">${p===null?'跳過':'下一題'}</button></div>`;
  app.innerHTML=h;
}
function pick(n){const it=view.list[view.pos];const ok=okAns(it.q,n);view.picked=n;
  st.ans[it.q]=ok;
  const w=st.wrong.indexOf(it.q);
  if(!ok&&w<0)st.wrong.push(it.q);
  if(ok&&view.mode==='wrong'&&w>=0)st.wrong.splice(w,1);
  save();render();}
function move(d){view.pos=Math.max(0,view.pos+d);view.picked=null;render();window.scrollTo(0,0);}

const EXQ={};QS.forEach((x,i)=>{(EXQ[x[0]]=EXQ[x[0]]||[]).push(i);});Object.values(EXQ).forEach(a=>a.sort((i,j)=>QS[i][1]-QS[j][1]));
const GOF={};GS.forEach((g,i)=>g.q.forEach(q=>GOF[q]=i));
const PTS=n=>n<=40?1.5:2;
function scoreOf(p,picks){let sc=0;EXQ[p].forEach(qi=>{const k=picks[qi];if(k&&okAns(qi,k))sc+=PTS(QS[qi][1]);});return Math.round(sc*10)/10;}
function examSel(){
  const done={};(st.exams||[]).forEach(e=>{(done[e.p]=done[e.p]||[]).push(e.score);});
  let h=`<div class="top"><button class="back" onclick="go({name:'home'})">‹ 目錄</button><div class="ttl">模擬考</div></div>
  <p class="sub">跟正式考試一樣：60 題，1–40 題每題 1.5 分、41–60 題每題 2 分，70 分及格，限時 90 分鐘。作答時不顯示對錯，交卷後才計分，答錯的題目自動進錯題本。</p>`;
  if(st.cur)h+=`<div class="curbox"><div>第 ${st.cur.p} 期還沒交卷（已答 ${Object.keys(st.cur.picks).length} 題）</div><button class="start" onclick="resumeExam()">繼續作答</button><button class="back" onclick="abandonExam()">放棄這份（不計分、不留紀錄）</button></div>`;
  h+=`<button class="start" style="background:var(--violet)" onclick="startExam()">隨機抽一期${Object.keys(done).length?'（優先抽還沒考過的）':''}</button>`;
  if((st.exams||[]).length){h+=`<div class="kp" style="margin-top:6px"><b>考試紀錄</b></div>`;
    st.exams.slice().reverse().forEach(e=>{const d=new Date(e.at);h+=`<div class="grp" style="cursor:default"><div class="s">第 ${e.p} 期　<b style="color:${e.score>=70?'var(--teal)':'var(--bad)'}">${e.score} 分</b>${e.score>=70?'　及格':'　未及格'}</div><div class="m">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}・用時 ${Math.round(e.sec/60)} 分鐘　<button class="del" onclick="delExam(${e.at})">刪除</button></div></div>`;});}
  h+=`<div class="kp" style="margin-top:14px"><b>或指定一期</b></div><div class="pgrid">`;
  for(let p=1;p<=20;p++)h+=`<button class="pbtn ${done[p]?'did':''}" onclick="startExam(${p})">${p}${done[p]?`<small>${Math.max(...done[p])}</small>`:''}</button>`;
  app.innerHTML=h+`</div>`;
}
function startExam(p){
  if(!p){const done=new Set((st.exams||[]).map(e=>e.p));let pool=[];for(let i=1;i<=20;i++)if(!done.has(i))pool.push(i);if(!pool.length)for(let i=1;i<=20;i++)pool.push(i);p=pool[Math.floor(Math.random()*pool.length)];}
  go({name:'examIntro',p});
}
function examIntro(){const p=view.p;const past=(st.exams||[]).filter(e=>e.p===p);
  app.innerHTML=`<div class="top"><button class="back" onclick="go({name:'examSel'})">‹ 模擬考</button><div class="ttl">第 ${p} 期模擬考</div></div>
  <div class="qcard"><p class="stem">準備好就開始，按下後才會計時。</p><p class="sub">60 題・90 分鐘・70 分及格。中途可以按「暫離」，回來繼續作答。${past.length?'<br>這期考過 '+past.length+' 次，最高 '+Math.max(...past.map(e=>e.score))+' 分。':''}</p>
  ${st.cur?`<p class="sub" style="color:var(--bad)">注意：你還有第 ${st.cur.p} 期沒交卷，開始這份會放棄那一份。</p>`:''}
  <button class="start" onclick="beginExam(${p})">開始作答</button><button class="back" onclick="go({name:'examSel'})">先不要，返回</button></div>`;}
function beginExam(p){st.cur={p,picks:{},start:Date.now(),pos:0};save();go({name:'exam'});}
function abandonExam(){if(!confirm('放棄第 '+st.cur.p+' 期這份？已作答的內容不會計分、不留紀錄。'))return;st.cur=null;save();render();}
function delExam(at){if(!confirm('刪除這筆考試紀錄？'))return;st.exams=st.exams.filter(e=>e.at!==at);st.del=[...(st.del||[]),at];save();render();}
function resumeExam(){go({name:'exam'});}
let timerI=null;
function tLeft(){return Math.max(0,90*60-Math.floor((Date.now()-st.cur.start)/1000));}
function fmt(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function examView(){
  const c=st.cur;if(!c){go({name:'examSel'});return;}
  const list=EXQ[c.p];const qi=list[c.pos];const q=QS[qi];const pk=c.picks[qi];
  const n=Object.keys(c.picks).length;
  let h=`<div class="top"><button class="back" onclick="go({name:'examSel'})">‹ 暫離</button><div class="ttl">第 ${c.p} 期模擬考・已答 ${n}/60</div><span class="timer" id="timer">${fmt(tLeft())}</span></div>`;
  h+=`<div class="qcard"><span class="src">第 ${q[1]} 題・${PTS(q[1])} 分</span><p class="stem">${esc(q[2])}</p>`;
  q[3].forEach((o,k)=>{h+=`<button class="opt ${pk===k+1?'sel':''}" onclick="examPick(${k+1})"><span class="n">${k+1}</span><span>${esc(o)}</span></button>`;});
  h+=`</div><div class="kp" style="margin-top:14px">點題號可以跳題</div><div class="qgrid">`;
  list.forEach((x,i)=>{h+=`<button class="qn ${c.picks[x]?'a':''} ${i===c.pos?'cur':''}" onclick="examJump(${i})">${i+1}</button>`;});
  h+=`</div><button class="start" style="background:var(--violet);margin-top:16px" onclick="submitExam()">交卷</button>`;
  h+=`<div class="nav"><button class="p" onclick="examJump(${c.pos-1})" ${c.pos===0?'disabled':''}>上一題</button><button class="n2" onclick="examJump(${c.pos+1})" ${c.pos===59?'disabled':''}>下一題</button></div>`;
  app.innerHTML=h;
  clearInterval(timerI);timerI=setInterval(()=>{const el=document.getElementById('timer');if(!el||view.name!=='exam'){clearInterval(timerI);return;}const t=tLeft();el.textContent=t?fmt(t):'時間到';if(!t)el.classList.add('late');},1000);
}
function examPick(k){const c=st.cur;const qi=EXQ[c.p][c.pos];c.picks[qi]=k;save();
  if(c.pos<59){c.pos++;save();}render();window.scrollTo(0,0);}
function examJump(i){if(i<0||i>59)return;st.cur.pos=i;save();render();window.scrollTo(0,0);}
function submitExam(){const c=st.cur;const n=Object.keys(c.picks).length;
  if(n<60&&!confirm('還有 '+(60-n)+' 題沒作答，確定要交卷嗎？'))return;
  const score=scoreOf(c.p,c.picks);const sec=Math.floor((Date.now()-c.start)/1000);
  EXQ[c.p].forEach(qi=>{const k=c.picks[qi];const ok=!!k&&okAns(qi,k);st.ans[qi]=ok;const w=st.wrong.indexOf(qi);if(!ok&&w<0)st.wrong.push(qi);});
  const rec={p:c.p,score,sec,at:Date.now(),picks:c.picks};st.exams=[...(st.exams||[]),rec];st.cur=null;save();
  clearInterval(timerI);go({name:'examRes',rec});}
function examRes(){const r=view.rec;const list=EXQ[r.p];
  const wrong=list.filter(qi=>!(r.picks[qi]&&okAns(qi,r.picks[qi])));
  let h=`<div class="top"><button class="back" onclick="go({name:'examSel'})">‹ 模擬考</button><div class="ttl">第 ${r.p} 期成績</div></div>
  <div class="score ${r.score>=70?'pass':'fail'}"><b>${r.score}</b><span>${r.score>=70?'及格（70 分以上）':'未及格，差 '+Math.round((70-r.score)*10)/10+' 分'}</span></div>
  <p class="sub">答錯或沒作答 ${wrong.length} 題，已收進錯題本。用時 ${Math.round(r.sec/60)} 分鐘。</p>`;
  wrong.forEach(qi=>{const q=QS[qi];const g=GS[GOF[qi]];const pk=r.picks[qi];
    h+=`<div class="qcard" style="margin-bottom:12px"><span class="src">第 ${q[1]} 題</span><p class="stem" style="font-size:16px">${esc(q[2])}</p>
    <p class="fbl no">你的答案：${pk?'('+pk+') '+esc(q[3][pk-1]):'沒作答'}</p><p class="fbl ok">正確答案：${esc(ansText(qi))}</p>
    ${g&&g.ex?`<div class="exp open"><div class="eh">為什麼是這個答案</div><p>${esc(g.ex)}</p></div>`:''}</div>`;});
  app.innerHTML=h;}

function exportProg(){const code=btoa(unescape(encodeURIComponent(JSON.stringify({ans:st.ans,wrong:st.wrong,exams:(st.exams||[]).map(e=>({p:e.p,score:e.score,sec:e.sec,at:e.at}))}))));
  const done=()=>alert('進度碼已複製。到另一個版本按「貼上進度碼匯入」即可。');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done,()=>prompt('請長按全選複製這段進度碼：',code));else prompt('請長按全選複製這段進度碼：',code);}
function importProg(){const code=prompt('把進度碼貼在這裡：');if(!code)return;
  try{const r=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    st.ans=Object.assign({},r.ans||{},st.ans);st.wrong=[...new Set([...st.wrong,...(r.wrong||[])])];
    const seen=new Set((st.exams||[]).map(e=>e.at));st.exams=[...(st.exams||[]),...(r.exams||[]).filter(e=>!seen.has(e.at))].sort((a,b)=>a.at-b.at);
    save();render();alert('匯入完成：已合併 '+Object.keys(r.ans||{}).length+' 題作答紀錄。');
  }catch(e){alert('進度碼格式不對，請確認有完整複製。');}}
render();
</script>
</body>
</html>
